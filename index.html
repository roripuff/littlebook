<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Happy Little Pages</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Amatic+SC:wght@700&family=Bungee&family=Caveat:wght@500;700&family=Chewy&family=Dancing+Script:wght@700&family=Fredoka:wght@500;600;700&family=Lobster&family=Pacifico&family=Poppins:wght@500;600&family=Satisfy&family=Gochi+Hand&family=Sacramento&family=Shrikhand&display=swap" rel="stylesheet">
<style>
  :root{
    --P: min(40vw, 440px, 66vh);
    --bg:#FFF6EE;
    --ink:#5B4B6E;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden}
  body{
    background:
      radial-gradient(circle at 12% 18%, #FFE1EA 0 120px, transparent 260px),
      radial-gradient(circle at 88% 22%, #DDF3E8 0 110px, transparent 260px),
      radial-gradient(circle at 80% 88%, #E5DDF8 0 120px, transparent 280px),
      radial-gradient(circle at 15% 85%, #FFF0C6 0 100px, transparent 260px),
      var(--bg);
    font-family:'Fredoka', system-ui, sans-serif;color:var(--ink);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    -webkit-tap-highlight-color:transparent; user-select:none;
  }
  body::before{content:"";position:fixed;inset:0;pointer-events:none;
    background-image:radial-gradient(#E9C9D6 1.2px, transparent 1.3px);background-size:26px 26px;opacity:.45}
  header{position:fixed;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:16px 22px;z-index:50}
  .brand{font-family:'Pacifico',cursive;font-size:clamp(20px,3vw,28px);color:#E7849F;text-shadow:2px 2px 0 #fff}
  .brand small{font-family:'Fredoka';font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:#9C8BB5;margin-left:10px;text-shadow:none;vertical-align:middle}
  .iconbtn{border:none;background:#fff;color:var(--ink);width:44px;height:44px;border-radius:50%;font-size:19px;cursor:pointer;box-shadow:0 4px 0 #EBD9F7, 0 8px 18px rgba(126,107,168,.15);transition:transform .15s}
  .iconbtn:hover{transform:translateY(-2px)}
  .iconbtn.off{opacity:.45}
  .iconbtn:focus-visible,.btn:focus-visible,.stage:focus-visible{outline:3px dashed #E7849F;outline-offset:4px}

  .stage{position:relative;width:100%;height:calc(var(--P) + 60px);display:flex;align-items:center;justify-content:center;perspective:2400px;outline:none;margin-top:10px}
  .book{position:relative;flex-shrink:0;width:calc(var(--P) * 2);height:var(--P);
    transform:translateX(calc(var(--P) * -0.5)) rotateX(10deg) rotateZ(-2deg);
    transition:transform 1s cubic-bezier(.6,0,.2,1);cursor:pointer}
  .book.open{transform:translateX(0) rotateX(12deg) rotateZ(0deg)}
  .float{animation:bob 3.2s ease-in-out infinite}
  @keyframes bob{50%{transform:translateY(-8px) rotate(.6deg)}}
  .float{position:absolute;inset:0}
  .page{position:absolute;top:0;width:var(--P);height:var(--P);border-radius:6px;transition:box-shadow .6s ease, opacity .5s}
  .page.left{left:0;border-radius:6px 2px 2px 6px}
  .page.right{left:var(--P);border-radius:2px 6px 6px 2px}
  .book.closed .page.left,.book.hideLeft .page.left{opacity:0;transition:none}
  .face{position:absolute;inset:0;overflow:hidden;border-radius:inherit;background:#fff}
  .face svg,.leaf svg{width:100%;height:100%;display:block}
  .page.right .face::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,rgba(91,75,110,.18),rgba(91,75,110,.04) 6%,transparent 14%)}
  .page.left .face::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(270deg,rgba(91,75,110,.2),rgba(91,75,110,.05) 6%,transparent 14%)}
  .leaves{position:absolute;top:0;left:var(--P);width:var(--P);height:var(--P);perspective:2200px;perspective-origin:0% 50%;z-index:5;pointer-events:none}
  .leaf{position:absolute;inset:0;transform-origin:0% 50%;transform-style:preserve-3d;will-change:transform}
  .leaf .side{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;transform:translateZ(0);-webkit-transform:translateZ(0)}
  .leaf .front{border-radius:2px 6px 6px 2px}
  .leaf .front::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,rgba(91,75,110,.18),rgba(91,75,110,.04) 6%,transparent 14%)}
  .leaf .back::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(270deg,rgba(91,75,110,.2),rgba(91,75,110,.05) 6%,transparent 14%)}
  .leaf .back{transform:rotateY(180deg) translateZ(0);-webkit-transform:rotateY(180deg) translateZ(0);border-radius:6px 2px 2px 6px}
  .leaf .shade{position:absolute;inset:0;pointer-events:none;opacity:0}
  .leaf .front .shade{background:linear-gradient(90deg,rgba(91,75,110,.35),rgba(91,75,110,.12))}
  .leaf .back .shade{background:linear-gradient(270deg,rgba(91,75,110,.35),rgba(91,75,110,.12))}
  .leaf.cover .front{border-radius:4px 10px 10px 4px}
  .leaf.staged{opacity:.001}

  .glow{position:absolute;inset:-14px;border-radius:18px;pointer-events:none;opacity:0;
    background:radial-gradient(closest-side,rgba(255,240,180,.9),rgba(255,240,180,0));}
  .glow.on{animation:glow 1.4s ease-out}
  @keyframes glow{0%{opacity:0;transform:scale(.9)}25%{opacity:.9}100%{opacity:0;transform:scale(1.08)}}

  .tag{display:none;position:absolute;left:50%;bottom:-6px;transform:translate(-50%,100%);font-family:'Caveat',cursive;font-weight:700;font-size:22px;color:#9C8BB5;white-space:nowrap;transition:opacity .4s}
  .hint{font-family:'Caveat',cursive;font-weight:700;font-size:clamp(22px,3vw,28px);color:#E7849F;margin-top:26px;height:40px;line-height:40px;white-space:nowrap;overflow:visible;text-align:center;animation:pulse 2s ease-in-out infinite}
  @keyframes pulse{50%{opacity:.55;transform:translateY(2px)}}
  .controls{display:flex;gap:12px;margin-top:8px;min-height:48px;opacity:0;transition:opacity .5s;pointer-events:none;flex-wrap:wrap;justify-content:center}
  .controls.show{opacity:1;pointer-events:auto}
  .btn{border:none;cursor:pointer;font-family:'Fredoka';font-weight:600;font-size:16px;padding:11px 20px;border-radius:999px;color:var(--ink);transition:transform .15s}
  .btn:hover{transform:translateY(-2px)}
  .btn.pink{background:#FBD3DE;box-shadow:0 4px 0 #EFAFC2}
  .btn.mint{background:#CDEFDF;box-shadow:0 4px 0 #A6DCC2}
  .btn.lav{background:#E2D8F7;box-shadow:0 4px 0 #C6B6EC}
  .btn:active{transform:translateY(3px);box-shadow:none}

  .confetti{position:fixed;pointer-events:none;z-index:60;border-radius:2px}
  .lightbox{position:fixed;inset:0;z-index:80;background:rgba(255,246,238,.82);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .35s;cursor:zoom-out}
  .lightbox.show{opacity:1;pointer-events:auto}
  .lightbox .card{width:min(88vw,80vh,640px);aspect-ratio:1;border-radius:14px;overflow:hidden;box-shadow:0 30px 60px rgba(126,107,168,.3),0 0 0 10px #fff;transform:scale(.85) rotate(-3deg);transition:transform .45s cubic-bezier(.3,1.5,.5,1)}
  .lightbox.show .card{transform:scale(1) rotate(0)}
  .lightbox .card svg{width:100%;height:100%;display:block}
  .loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);z-index:100;font-family:'Caveat',cursive;font-size:30px;color:#E7849F;transition:opacity .5s}
  .loading.gone{opacity:0;pointer-events:none}

  @media (max-width:720px){
    :root{--P:min(80vw,60vh)}
    .book.open{transform:translateX(calc(var(--P) * -0.5)) rotateX(8deg)}
    .brand small{display:none}
  }
  @media (prefers-reduced-motion: reduce){ .float,.hint{animation:none} }
</style>
</head>
<body>
<div class="loading" id="loading">warming up the pages…</div>
<header>
  <div class="brand">Happy Little Pages <small>quotes · treats · tunes</small></div>
  <div style="display:flex;gap:10px"><button class="iconbtn" id="music" aria-label="Turn music off" title="Background music">🎵</button><button class="iconbtn" id="sound" aria-label="Turn page sounds off" title="Page sounds">🔊</button></div>
</header>

<div class="stage" id="stage" tabindex="0" role="button" aria-label="Flip the book to a random page">
  <div class="book closed" id="book">
    <div class="float">
      <div class="glow" id="glow" style="left:var(--P);width:var(--P)"></div>
      <div class="page left" id="left"><div class="face" id="leftFace"></div></div>
      <div class="page right" id="right"><div class="face" id="rightFace"></div></div>
      <div class="leaves" id="leaves"></div>
      <div class="tag" id="tag" style="left:calc(var(--P) * 1.5)"></div>
    </div>
  </div>
</div>
<div class="hint" id="hint">tap the book to open it ✿</div>
<div class="controls" id="controls">
  <button class="btn pink" id="again">↻ Flip again</button>
  <button class="btn mint" id="big">⤢ View big</button>
  <button class="btn lav" id="close">Close book</button>
</div>
<div class="lightbox" id="lightbox" aria-hidden="true"><div class="card" id="lbcard"></div></div>

<script>
/* ============ palette & fonts ============ */
const C={pink:'#F9C9D6',rose:'#E7849F',deepRose:'#D9668A',peach:'#FFD3B6',apricot:'#F4A37F',butter:'#FFF0B3',lemon:'#FBD96A',mint:'#C9EEDB',mint2:'#A8E2C8',teal:'#4F9A92',sky:'#C8E4F6',blue:'#7FA7D9',lav:'#DCCFF5',plum:'#7E6BA8',lilac:'#EBD9F7',sage:'#CFE6C3',leaf:'#8CC59A',leaf2:'#6FB083',ink:'#5B4B6E',coral:'#FF9E93',choc:'#A47863',tan:'#EBC491',white:'#FFFFFF',cream:'#FFF8EE'};
const F={kau:"'Kaushan Script',cursive",yel:"'Yellowtail',cursive",pop:"'Poppins',sans-serif",sat:"'Satisfy',cursive",goc:"'Gochi Hand',cursive",pac:"'Pacifico',cursive",sac:"'Sacramento',cursive",ama:"'Amatic SC',cursive",fred:"'Fredoka',sans-serif",abr:"'Abril Fatface',serif",shr:"'Shrikhand',cursive",cav:"'Caveat',cursive",bun:"'Bungee',sans-serif",lob:"'Lobster',cursive",dan:"'Dancing Script',cursive",che:"'Chewy',cursive"};
const FONT_LOAD=["Satisfy","Gochi Hand","600 32px Poppins","500 32px Poppins","Pacifico","Sacramento","700 32px 'Amatic SC'","600 32px Fredoka","Abril Fatface","Shrikhand","700 32px Caveat","Bungee","Lobster","700 32px 'Dancing Script'","Chewy"];
const PASTELS=['#F9C9D6','#FFD3B6','#FFF0B3','#C9EEDB','#C8E4F6','#DCCFF5','#EBD9F7','#CFE6C3','#FFE0E6','#FFE9C9','#D7F0F2','#F3D7EE'];

/* ============ helpers ============ */
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
const g=(x,y,s,r,inner)=>`<g transform="translate(${x} ${y}) rotate(${r||0}) scale(${s||1})">${inner}</g>`;
function T(txt,x,y,o={}){
  const a=[`x="${x}"`,`y="${y}"`,`text-anchor="${o.a||'middle'}"`,`font-family="${o.f||F.fred}"`,`font-size="${o.s||40}"`,`fill="${o.c||C.ink}"`];
  if(o.w)a.push(`font-weight="${o.w}"`); if(o.ls)a.push(`letter-spacing="${o.ls}"`);
  if(o.st)a.push(`stroke="${o.st}" stroke-width="${o.sw||8}" paint-order="stroke" stroke-linejoin="round"`);
  if(o.r)a.push(`transform="rotate(${o.r} ${x} ${y})"`);
  if(o.op)a.push(`opacity="${o.op}"`);
  return `<text ${a.join(' ')} data-maxw="${o.max||340}">${esc(txt)}</text>`;
}
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function confetti(seed,n,cols,avoid=[],sz=1){const R=rng(seed);let s='';let k=0,tries=0;while(k<n&&tries<n*30){tries++;const x=R()*390+5,y=R()*370+5;if(avoid.some(([x1,y1,x2,y2])=>x>x1&&x<x2&&y>y1&&y<y2))continue;const c=cols[k%cols.length];const t=R();const rot=R()*180;
  if(t<.35)s+=`<rect x="${x}" y="${y}" width="${4*sz}" height="${11*sz}" rx="${2*sz}" fill="${c}" transform="rotate(${rot} ${x} ${y})"/>`;
  else if(t<.65)s+=`<circle cx="${x}" cy="${y}" r="${(2.5+R()*3)*sz}" fill="${c}"/>`;
  else if(t<.85)s+=g(x,y,.6*sz,rot,sparkle(c));
  else s+=`<path d="M${x} ${y} q4 -6 8 0 t8 0" stroke="${c}" stroke-width="${2.5*sz}" fill="none" stroke-linecap="round"/>`;k++;}return s;}
function dotsGrid(c,step=24,r=2,op=.5,off=0){let s=`<g fill="${c}" opacity="${op}">`;for(let y=step/2;y<400;y+=step)for(let x=step/2+((y/step|0)%2?step/2:0)+off;x<400;x+=step)s+=`<circle cx="${x}" cy="${y}" r="${r}"/>`;return s+'</g>';}

/* ============ illustration library ============ */
const kawaii=(x=0,y=0,s=1,ink=C.ink)=>g(x,y,s,0,`<path d="M-14 -4 q4 -5 8 0 M6 -4 q4 -5 8 0" stroke="${ink}" stroke-width="2.6" fill="none" stroke-linecap="round"/><path d="M-5 4 q5 5 10 0" stroke="${ink}" stroke-width="2.6" fill="none" stroke-linecap="round"/><ellipse cx="-19" cy="4" rx="5" ry="3" fill="#F49BB2" opacity=".8"/><ellipse cx="19" cy="4" rx="5" ry="3" fill="#F49BB2" opacity=".8"/>`);
const silly=(x=0,y=0,s=1)=>g(x,y,s,0,`<circle cx="-9" cy="-4" r="3" fill="${C.ink}"/><path d="M5 -6 l7 3 l-7 3" stroke="${C.ink}" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M-7 5 q7 6 14 0" stroke="${C.ink}" stroke-width="2.4" fill="none" stroke-linecap="round"/><path d="M1 8 q0 8 5 7 q4 -1 2 -8" fill="#F48A9E"/><ellipse cx="-17" cy="4" rx="4.5" ry="2.8" fill="#F49BB2" opacity=".8"/><ellipse cx="18" cy="4" rx="4.5" ry="2.8" fill="#F49BB2" opacity=".8"/>`);
const flower=(c,m=C.lemon)=>[0,72,144,216,288].map(a=>`<ellipse cx="0" cy="-13" rx="9" ry="13" fill="${c}" transform="rotate(${a})"/>`).join('')+`<circle r="7" fill="${m}"/><circle r="2.6" fill="#fff" opacity=".7" cx="-2" cy="-2"/>`;
const daisy=(c='#fff',m=C.lemon)=>Array.from({length:12},(_,i)=>`<ellipse cx="0" cy="-14" rx="4.5" ry="12" fill="${c}" transform="rotate(${i*30})"/>`).join('')+`<circle r="8" fill="${m}"/>`;
const tulip=(c,s=C.leaf2)=>`<path d="M0 0 C2 20 0 40 0 60" stroke="${s}" stroke-width="4" fill="none" stroke-linecap="round"/><path d="M0 44 C10 30 20 30 26 22 C12 20 4 28 0 44Z" fill="${s}"/><path d="M-16 -18 L-8 -6 L0 -20 L8 -6 L16 -18 C18 0 10 8 0 8 C-10 8 -18 0 -16 -18Z" fill="${c}"/>`;
const leaf=c=>`<path d="M0 0 C10 -10 10 -28 0 -40 C-10 -28 -10 -10 0 0Z" fill="${c}"/><path d="M0 -4 L0 -34" stroke="#fff" stroke-opacity=".5" stroke-width="1.5"/>`;
function sprig(c=C.leaf,n=5){let s=`<path d="M0 0 Q6 ${-n*11} 0 ${-n*23}" stroke="${c}" stroke-width="3" fill="none" stroke-linecap="round"/>`;for(let i=1;i<=n;i++){const side=i%2?1:-1;s+=g(side*1.5,-i*21,.55,side*55,leaf(c));}return s+g(0,-n*23+4,.5,0,leaf(c));}
const sun=(c=C.lemon,ray=C.apricot,face=true)=>Array.from({length:12},(_,i)=>`<rect x="-4" y="-58" width="8" height="18" rx="4" fill="${ray}" transform="rotate(${i*30})"/>`).join('')+`<circle r="35" fill="${c}"/>`+(face?kawaii(0,4,1):'');
const cloud=(c='#fff',face=0)=>`<g fill="${c}"><circle cx="-22" cy="2" r="16"/><circle cx="0" cy="-10" r="22"/><circle cx="22" cy="2" r="16"/><rect x="-38" y="0" width="76" height="18" rx="9"/></g>`+(face===1?kawaii(0,4,.7):face===2?silly(0,4,.8):'');
const rainbow=(cols,r=120,w=16)=>cols.map((c,i)=>{const R=r-i*w;return `<path d="M${-R} 0 A${R} ${R} 0 0 1 ${R} 0" stroke="${c}" stroke-width="${w+.6}" fill="none"/>`}).join('');
const heart=c=>`<path d="M0 12 C-26 -6 -12 -26 0 -12 C12 -26 26 -6 0 12Z" fill="${c}"/>`;
function star(c,r=12){let p=[];for(let i=0;i<10;i++){const R=i%2?r*.45:r;const a=-Math.PI/2+i*Math.PI/5;p.push((Math.cos(a)*R).toFixed(1)+','+(Math.sin(a)*R).toFixed(1));}return `<polygon points="${p.join(' ')}" fill="${c}" stroke="${c}" stroke-width="2" stroke-linejoin="round"/>`;}
const sparkle=c=>`<path d="M0 -12 Q2 -2 12 0 Q2 2 0 12 Q-2 2 -12 0 Q-2 -2 0 -12Z" fill="${c}"/>`;
const moon=c=>`<path d="M0 -30 A30 30 0 1 0 0 30 A40 40 0 0 1 0 -30Z" fill="${c}"/>`;
const balloon=(a,b)=>`<path d="M0 -44 C30 -44 38 -12 12 18 L-12 18 C-38 -12 -30 -44 0 -44Z" fill="${a}"/><path d="M0 -44 C12 -44 16 -12 5 18 L-5 18 C-16 -12 -12 -44 0 -44Z" fill="${b}"/><path d="M-11 18 L-8 30 M11 18 L8 30" stroke="${C.choc}" stroke-width="1.6"/><rect x="-9" y="29" width="18" height="12" rx="3" fill="${C.tan}"/><path d="M-9 33 h18" stroke="${C.choc}" stroke-width="1.2"/>`;
const sprinkles=(arr)=>arr.map(([x,y,r,c])=>`<rect x="${x-1.5}" y="${y-4}" width="3" height="8" rx="1.5" fill="${c}" transform="rotate(${r} ${x} ${y})"/>`).join('');
const cupcake=(w,f)=>`<path d="M-24 0 L24 0 L18 32 L-18 32Z" fill="${w}"/>${[-14,-5,4,13].map(x=>`<path d="M${x} 2 L${(x*.78).toFixed(1)} 30" stroke="#fff" stroke-opacity=".55" stroke-width="2.5"/>`).join('')}<g fill="${f}"><circle cx="-16" cy="-4" r="13"/><circle cx="16" cy="-4" r="13"/><circle cx="0" cy="-12" r="16"/><circle cx="0" cy="-27" r="10"/><rect x="-29" y="-6" width="58" height="9" rx="4.5"/></g>`+sprinkles([[-14,-8,30,C.blue],[-4,-18,-40,C.lemon],[8,-10,60,C.rose],[16,-2,-20,C.teal],[-20,0,80,C.apricot],[2,-28,10,C.plum]])+`<circle cx="0" cy="-41" r="6" fill="#EE6F8A"/><path d="M0 -46 q3 -8 9 -9" stroke="${C.leaf2}" stroke-width="2" fill="none"/>`;
const iceCream=()=>`<path d="M-22 0 L22 0 L0 56Z" fill="${C.tan}"/><path d="M-14 4 L8 40 M0 4 L15 26 M14 4 L-8 40 M0 4 L-15 26" stroke="#CF9F66" stroke-width="2"/><circle cx="-12" cy="-6" r="16" fill="${C.mint2}"/><circle cx="12" cy="-6" r="16" fill="#F7B6C8"/><circle cx="0" cy="-27" r="18" fill="#FFE9A8"/><path d="M-26 -4 Q-24 10 -18 4 Q-14 14 -8 2 Q-2 12 4 2 Q10 14 16 3 Q22 10 26 -4Z" fill="#F7B6C8"/>`+sprinkles([[-8,-32,30,C.rose],[6,-36,-30,C.blue],[10,-24,70,C.teal],[-14,-20,-60,C.apricot],[0,-18,10,C.plum],[-18,-8,40,C.lemon],[16,-10,-20,C.lemon]])+`<circle cx="2" cy="-48" r="5.5" fill="#EE6F8A"/>`;
const lemon=()=>`<path d="M-34 0 C-30 -24 30 -24 34 0 C30 24 -30 24 -34 0Z" fill="${C.lemon}"/><circle cx="-35" cy="0" r="4" fill="${C.lemon}"/><circle cx="35" cy="0" r="4" fill="${C.lemon}"/><path d="M-16 -9 q10 -6 20 -4" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".6" fill="none"/>`+g(-4,-14,.5,-60,leaf(C.leaf2));
const lemonSlice=(c=C.lemon)=>`<circle r="30" fill="${c}"/><circle r="25" fill="#FFF6C8"/>`+Array.from({length:8},(_,i)=>`<path d="M0 0 L0 -23" stroke="${c}" stroke-width="2.5" transform="rotate(${i*45})"/>`).join('')+`<circle r="3.5" fill="${c}"/>`;

/* ============ little animation helpers (SVG, loop forever) ============ */
const SPL='calcMode="spline" keyTimes="0;.5;1" keySplines=".45 0 .55 1;.45 0 .55 1"';
const A={
  bob:(i,dy=6,dur=3,d=0)=>`<g>${i}<animateTransform attributeName="transform" type="translate" values="0 0;0 ${-dy};0 0" dur="${dur}s" begin="${d}s" repeatCount="indefinite" ${SPL}/></g>`,
  spin:(i,dur=8)=>`<g>${i}<animateTransform attributeName="transform" type="rotate" values="0;360" dur="${dur}s" repeatCount="indefinite"/></g>`,
  sway:(i,deg=5,dur=3,cx=0,cy=0,d=0)=>`<g>${i}<animateTransform attributeName="transform" type="rotate" values="${-deg} ${cx} ${cy};${deg} ${cx} ${cy};${-deg} ${cx} ${cy}" dur="${dur}s" begin="${d}s" repeatCount="indefinite" ${SPL}/></g>`,
  pulse:(i,k=1.08,dur=1.6)=>`<g>${i}<animateTransform attributeName="transform" type="scale" values="1;${k};1" dur="${dur}s" repeatCount="indefinite" ${SPL}/></g>`,
  blink:(i,dur=2,d=0,min=.15)=>`<g>${i}<animate attributeName="opacity" values="1;${min};1" dur="${dur}s" begin="${d}s" repeatCount="indefinite"/></g>`,
  flap:(i,dur=.5,d=0)=>`<g>${i}<animateTransform attributeName="transform" type="scale" values="1 1;.55 1;1 1" dur="${dur}s" begin="${d}s" repeatCount="indefinite"/></g>`,
  drift:(i,dx,dy,dur=4,d=0)=>`<g opacity="0">${i}<animateTransform attributeName="transform" type="translate" values="0 0;${dx} ${dy}" dur="${dur}s" begin="${d}s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.2;.75;1" dur="${dur}s" begin="${d}s" repeatCount="indefinite"/></g>`,
};
A.rise=(i,h=40,dur=3,d=0)=>A.drift(i,0,-h,dur,d);
A.fall=(i,h=40,dur=2,d=0)=>A.drift(i,0,h,dur,d);
const steam=(n=3,gap=14,h=22)=>Array.from({length:n},(_,i)=>g(i*gap-(n-1)*gap/2,0,1,0,A.rise(`<path d="M0 0 c-6 -6 6 -12 0 -18" stroke="#fff" stroke-width="3.5" fill="none" stroke-linecap="round"/>`,h,2.6,-i*.9))).join('');

function animateLeaf(leaf,delay,dur,ez,onStart,onMid){
  const easing=cb(ez);

  setTimeout(()=>{onMid&&onMid();},delay+dur*midFrac(ez));

  let st=STAGED&&STAGED.closed===wasClosed&&STAGED.from===current?finishStage(STAGED):stage(wasClosed);STAGED=null;
  const target=st.target,leaves=st.leaves;
  if(wasClosed){book.classList.add('hideLeft');book.classList.remove('closed');book.classList.add('open');leftFace.innerHTML=ENDPAPER;}
  rightFace.innerHTML=PAGES[target].still;
  leaves.forEach(l=>l.classList.remove('staged'));
  const startPage=current<0?0:PAGES[current].num;
  // timing: quick riffle that slows down to a stop
  let t=wasClosed?0:0,proms=[];const M=leaves.length;
  leaves.forEach((l,i)=>{
    const k=i/(M-1||1);
    let dur,ease;
    if(wasClosed&&i===0){dur=1100;ease=EZ.cover;}
    else{dur=260+Math.pow(k,2.2)*820;ease=i===M-1?EZ.last:EZ.fast;}
    const myT=t;
    proms.push(animateLeaf(l,myT,dur,ease,()=>{flipSound(i===M-1?1.3:1);
      if(i%Math.ceil(M/3)===0){const pg=Math.round(startPage+(PAGES[target].num-startPage)*k);edges(pg);}},
      ()=>{l.style.zIndex=1000+i;if(i===0)book.classList.remove('hideLeft');}));
    t+= (wasClosed&&i===0)?620:(38+Math.pow(k,3)*430);
  });
  await Promise.all(proms);
  // settle: keep last back on the left, clear the leaves
  leftFace.innerHTML=leaves[M-1].querySelector('.back').innerHTML.replace('<div class="shade"></div>','');
  leavesEl.innerHTML='';
  current=target;state='open';edges(PAGES[target].num);
  rightFace.innerHTML=PAGES[target].html;
  landed();
  setTimeout(()=>stageLater(false),1600);
}
function landed(){
  const glow=$('glow');glow.classList.remove('on');void glow.offsetWidth;glow.classList.add('on');
  chime();burst();
  const p=PAGES[current];
  $('tag').textContent=`~ page ${p.num} of ${TOTAL} ~`;$('tag').style.opacity=1;
  $('hint').textContent='tap the book to flip again ✿';
  $('controls').classList.add('show');
}
function burst(){
  if(reduce)return;const r=rightPage.getBoundingClientRect();const cx=r.left+r.width/2,cy=r.top+r.height/2;
  for(let i=0;i<34;i++){const d=document.createElement('div');d.className='confetti';const s=6+Math.random()*7;d.style.cssText+=`width:${s}px;height:${s*(Math.random()<.5?1:2)}px;left:${cx}px;top:${cy}px;background:${['#F7A8B8','#FFE69A','#BFE6C6','#B9D6F2','#D4C5F0','#FFC9A8'][i%6]};${Math.random()<.4?'border-radius:50%':''}`;document.body.appendChild(d);
    const a=Math.random()*Math.PI*2,v=r.width*(.45+Math.random()*.5);
    d.animate([{transform:'translate(-50%,-50%) rotate(0)',opacity:1},{transform:`translate(${Math.cos(a)*v}px,${Math.sin(a)*v+r.height*.3}px) rotate(${Math.random()*720}deg)`,opacity:0}],{duration:1200+Math.random()*600,easing:'cubic-bezier(.15,.7,.3,1)'}).finished.then(()=>d.remove());}
}
async function closeBook(){
  if(state!=='open')return;state='busy';$('controls').classList.remove('show');STAGED=null;leavesEl.innerHTML='';$('tag').style.opacity=0;
  const l=makeLeaf(COVER,leftFace.innerHTML,'cover');l.style.zIndex=3000;l.style.transform='rotateY(-180deg)';leavesEl.appendChild(l);
  flipSound(1.2);
  const a=l.animate([{transform:'rotateY(-180deg)'},{transform:'rotateY(0deg)'}],{duration:900,easing:'cubic-bezier(.5,0,.25,1)',fill:'forwards'});
  setTimeout(()=>{book.classList.add('hideLeft');},900*(1-midFrac(EZ.cover)));setTimeout(()=>{book.classList.remove('open');book.classList.add('closed');},350);
  await a.finished;
  rightFace.innerHTML=COVER;leavesEl.innerHTML='';current=-1;state='closed';book.classList.remove('hideLeft');edges(0);STAGED=null;stageLater(true);
  $('hint').textContent='tap the book to open it ✿';
}
function openLightbox(){if(current<0)return;$('lbcard').innerHTML=PAGES[current].html;$('lightbox').classList.add('show');$('lightbox').setAttribute('aria-hidden','false');}
function closeLightbox(){$('lightbox').classList.remove('show');$('lightbox').setAttribute('aria-hidden','true');}

$('stage').addEventListener('click',flip);
$('stage').addEventListener('keydown',e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();flip();}});
$('again').addEventListener('click',flip);
$('big').addEventListener('click',openLightbox);
$('close').addEventListener('click',closeBook);
$('lightbox').addEventListener('click',closeLightbox);
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeLightbox();});
/* ============ soft background music (generated live: warm pads + music box) ============ */
const mtof=n=>440*Math.pow(2,(n-69)/12);
const Music={on:true,playing:false,timer:null,master:null,bus:null,next:0,step:0,mi:3,
  ctx(){actx=actx||new (window.AudioContext||window.webkitAudioContext)();return actx;},
  init(){if(this.master)return;const c=this.ctx();
    this.master=c.createGain();this.master.gain.value=0;
    const lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=2400;
    const rev=c.createConvolver(),len=c.sampleRate*3.4,ir=c.createBuffer(2,len,c.sampleRate);
    for(let ch=0;ch<2;ch++){const d=ir.getChannelData(ch);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.8);}
    rev.buffer=ir;const wet=c.createGain();wet.gain.value=.6;
    this.bus=c.createGain();this.bus.connect(lp);lp.connect(this.master);this.bus.connect(rev);rev.connect(wet);wet.connect(this.master);this.master.connect(c.destination);},
  start(){if(!this.on)return;try{this.init();const c=this.ctx();c.resume&&c.resume();if(this.playing)return;this.playing=true;
    this.next=c.currentTime+.15;this.step=0;
    this.master.gain.cancelScheduledValues(c.currentTime);this.master.gain.setValueAtTime(this.master.gain.value,c.currentTime);this.master.gain.linearRampToValueAtTime(.55,c.currentTime+3);
    this.timer=setInterval(()=>this.tick(),150);this.tick();}catch(e){}},
  stop(){if(!this.playing)return;const c=this.ctx();this.playing=false;clearInterval(this.timer);
    this.master.gain.cancelScheduledValues(c.currentTime);this.master.gain.setValueAtTime(this.master.gain.value,c.currentTime);this.master.gain.linearRampToValueAtTime(0,c.currentTime+.8);},
  tick(){const c=this.ctx(),e=60/64/2;while(this.next<c.currentTime+.7){this.play(this.step,this.next,e);this.next+=e;this.step++;}},
  play(step,t,e){
    const CH=[[48,55,64,67,71],[45,52,60,64,67],[41,48,57,60,64],[43,50,59,62,67]];
    const bar=Math.floor(step/16)%4,s=step%16,ch=CH[bar],barLen=16*e;
    if(s===0){ch.slice(1).forEach(n=>this.pad(n,t,barLen));this.bell(ch[0],t,.05,5,true);}
    const notes=[...new Set([...ch.slice(1).map(n=>n+12),...ch.slice(2).map(n=>n+24)])].sort((a,b)=>a-b);
    const play=s===0||(s%2===0&&Math.random()<.5)||(s%2===1&&Math.random()<.12);
    if(play){this.mi=Math.max(0,Math.min(notes.length-1,this.mi+[-2,-1,-1,1,1,2,0][Math.random()*7|0]));this.bell(notes[this.mi],t+(Math.random()*.02),.045,2.6);}
  },
  pad(n,t,dur){const c=this.ctx();[-5,5].forEach(dt=>{const o=c.createOscillator(),gn=c.createGain();o.type='triangle';o.frequency.value=mtof(n);o.detune.value=dt;
    gn.gain.setValueAtTime(0,t);gn.gain.linearRampToValueAtTime(.016,t+2.2);gn.gain.setValueAtTime(.016,t+dur-.3);gn.gain.linearRampToValueAtTime(0,t+dur+1.8);
    o.connect(gn);gn.connect(this.bus);o.start(t);o.stop(t+dur+2);});},
  bell(n,t,vol,dec,soft){const c=this.ctx();[[1,1],[2,.25],[3,.06]].forEach(([m,a])=>{const o=c.createOscillator(),gn=c.createGain();o.type='sine';o.frequency.value=mtof(n)*m;
    gn.gain.setValueAtTime(0.0001,t);gn.gain.exponentialRampToValueAtTime(vol*a,t+(soft?.4:.012));gn.gain.exponentialRampToValueAtTime(0.0001,t+dec/m);
    o.connect(gn);gn.connect(this.bus);o.start(t);o.stop(t+dec/m+.1);});}
};
document.addEventListener('visibilitychange',()=>{if(!actx)return;document.hidden?actx.suspend():actx.resume();});
$('music').addEventListener('click',()=>{Music.on=!Music.on;$('music').classList.toggle('off',!Music.on);$('music').setAttribute('aria-label',Music.on?'Turn music off':'Turn music on');Music.on?Music.start():Music.stop();});
$('sound').addEventListener('click',()=>{soundOn=!soundOn;$('sound').textContent=soundOn?'🔊':'🔈';$('sound').setAttribute('aria-label',soundOn?'Turn page sounds off':'Turn page sounds on');});

/* ============ boot ============ */
(async function(){
  try{await Promise.race([Promise.all(FONT_LOAD.map(f=>document.fonts.load(f.includes('px')?f:`32px '${f}'`))),new Promise(r=>setTimeout(r,3500))]);}catch(e){}
  COVER=fitSVG(coverSVG());
  if(reduce)PAGES.forEach(p=>{const a=p.art,t=p.tpl;});ENDPAPER=fitSVG(endpaperSVG());
  const STRIP=h=>h.replace(/<animate(Transform|Motion)?[^>]*\/>/g,'').replace(/<animate[^>]*>\s*<\/animate>/g,'');
  PAGES.forEach(p=>{p.html=fitSVG(pageSVG(p));p.still=STRIP(p.html);if(reduce)p.html=p.still;});
  holder.remove();
  // the cover sits on the right page while closed
  const coverLeafHolder=COVER;rightFace.innerHTML=coverLeafHolder;
  edges(0);
  $('loading').classList.add('gone');
  stageLater(true);
  setTimeout(()=>idle(()=>{try{Music.init();}catch(e){}},1500),1200);
  window.__ready=true;
})();
